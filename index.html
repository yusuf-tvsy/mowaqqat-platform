<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c3b30" />
  <meta name="description" content="مركز دراسات وأبحاث الأيتام — تصور لمؤسسة معرفية متخصصة بالبحث العلمي والتطبيقي، ومكتبة محمد شندي الراوي، والمجلة والمرصد والشراكات." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="مركز دراسات وأبحاث الأيتام" />
  <meta property="og:description" content="العلم في خدمة الكرامة والتمكين والمستقبل" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  
  
  
  <style>/* Center for Orphan Studies and Research | Visual system 1.1 */
:root {
  --green-950:#082c25;--green-900:#0b382e;--green-800:#10503c;
  --green-700:#176b4d;--green-200:#d8e8de;--green-100:#edf5f0;
  --gold-800:#8e691a;--gold-700:#a87b22;--gold-600:#c69a38;
  --gold-500:#dfb758;--gold-100:#fbf4e3;
  --ink:#21362e;--text:#344b43;--muted:#698078;
  --paper:#fff;--canvas:#f8f9f6;--line:#e4eae5;
  --shadow:0 20px 65px rgba(11,56,46,.08);
  --shadow-small:0 9px 29px rgba(11,56,46,.055);
  --r:21px;--font:'IBM Plex Sans Arabic','Tajawal','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.9 var(--font);direction:rtl;min-width:320px;overflow-x:hidden}
body,button,input,select,textarea{font-family:var(--font)}
button,input,select,textarea{font-size:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%}
img{display:block}
::selection{background:#d2bd78;color:#0c382f}
:focus-visible{outline:3px solid #dcac3e;outline-offset:4px}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3{line-height:1.39;letter-spacing:-.025em}
p{color:var(--text);margin-bottom:1.15em}
.container{width:min(1180px,calc(100% - 64px));margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;z-index:99;top:-80px;right:20px;background:#fff;color:#083a2c;padding:8px 22px;border-radius:10px;box-shadow:var(--shadow)}
.skip-link:focus{top:20px}
.announcement{background:var(--green-950);color:#c7d9ce;font-size:11.8px;line-height:1.5}
.ann-inner{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:38px}
.ann-inner span{display:inline-flex;align-items:center;gap:10px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#b9a155;display:inline-block;flex-shrink:0;box-shadow:0 0 0 4px #ddc56822}
.ann-inner a{display:inline-flex;align-items:center;gap:8px;color:#eedaa3;transition:color .2s}
.ann-inner a:hover{color:#fff}
.header{height:92px;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.975);backdrop-filter:blur(22px);border-bottom:1px solid #e8eee8}
.header-inner{height:100%;display:flex;align-items:center;gap:24px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:295px}
.brand img{height:53px;width:53px;object-fit:contain}
.brand span{display:flex;flex-direction:column;gap:0}
.brand strong{font-size:16px;line-height:1.5;font-weight:800;color:var(--green-900);letter-spacing:-.035em}
.brand small{font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.6}
.desktop-nav{display:flex;align-items:center;gap:4px;white-space:nowrap}
.nav-link{font-size:12.8px;font-weight:600;color:#3d584d;padding:12px 11px;border-radius:9px;transition:.2s}
.nav-link:hover,.desktop-nav .nav-link.active{background:var(--green-100);color:var(--green-900)}
.desktop-nav .nav-link.active{position:relative}
.desktop-nav .nav-link.active:after{content:'';position:absolute;bottom:4px;right:30%;width:40%;height:2px;border-radius:10px;background:var(--gold-600)}
.header-actions{display:flex;align-items:center;gap:10px}
.top-partner{white-space:nowrap;display:inline-flex;align-items:center;gap:9px;background:var(--green-900);color:#fff;font-size:12.5px;font-weight:700;padding:11px 16px;border-radius:10px;transition:.2s}
.top-partner:hover{background:var(--green-700);transform:translateY(-2px)}
.icon-button{border:1px solid var(--line);width:44px;height:44px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--green-900)}
.mobile-toggle,.mobile-nav,.mobile-shade{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-weight:700;font-size:14px;line-height:1.45;border-radius:11px;min-height:52px;padding:12px 24px;border:1px solid transparent;transition:transform .2s,box-shadow .2s,background .2s,color .2s;max-width:100%}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(4,33,24,.12)}
.btn svg,.text-link svg{transition:transform .2s}
.btn:hover svg,.text-link:hover svg{transform:translateX(-4px)}
.btn-primary{color:#fff;background:var(--green-900)}
.btn-primary:hover{background:var(--green-700)}
.btn-gold{color:#16362b;background:linear-gradient(135deg,#efcb76,#d8aa43)}
.btn-gold:hover{background:linear-gradient(135deg,#f7db98,#d3a137)}
.btn-outline{color:var(--green-800);border-color:#c8d9cd;background:transparent}
.btn-outline-light{color:#fff;background:transparent;border-color:#ffffff6b}
.btn-outline-light:hover{background:#ffffff16}
.text-link{display:inline-flex;align-items:center;gap:9px;color:var(--green-800);font-size:13px;font-weight:800}
.text-link:hover{color:var(--gold-800)}
.section{padding:95px 0;position:relative}
.section-soft{background:var(--canvas)}
.section-lightgreen{background:#eaf3ed}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:22px;margin-bottom:36px}
.section-heading-copy{max-width:785px}
.section-heading h2,.split-copy h2,.editorial-copy h2,.two-col-info h2,.budget-heading h2{font-size:clamp(27px,3.3vw,39px);font-weight:800;color:var(--green-950);letter-spacing:-.05em;margin:12px 0 13px;line-height:1.38}
.section-heading p{font-size:15px;margin:0;max-width:720px}
.eyebrow{display:inline-block;color:var(--gold-800);font-size:12px;letter-spacing:.015em;font-weight:800}
.eyebrow-gold{color:#ead08f}
.em-green{color:var(--green-700)}
.features-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.feature-card{padding:34px 29px 29px;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--shadow-small);transition:transform .2s,border-color .2s}
.feature-card:hover{transform:translateY(-6px);border-color:#cdded1}
.feature-icon{display:inline-flex;align-items:center;justify-content:center;width:57px;height:57px;border-radius:17px;background:var(--green-100);color:var(--green-800);margin-bottom:19px}
.feature-card h3{font-size:19px;color:var(--green-950);margin:0 0 10px}
.feature-card p{font-size:13.8px;line-height:1.95;margin:0;color:var(--text)}
.value-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.value-grid .feature-card{padding:27px 22px}
.value-grid .feature-card h3{font-size:17px}
.value-grid .feature-card p{font-size:13px}
/* Hero */
.home-hero{background:linear-gradient(113deg,#052d25 0%,#0b4335 56%,#0d513e 100%);color:#fff;position:relative;overflow:hidden;padding:78px 0 0}
.home-hero:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 60% 70%,rgba(255,255,255,.035) 0 1px,transparent 1.5px);background-size:29px 29px;opacity:.7}
.hero-glow{position:absolute;width:750px;height:750px;border-radius:50%;background:radial-gradient(circle,rgba(189,152,74,.13),transparent 64%);left:-175px;top:-230px;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.07fr .93fr;align-items:center;min-height:565px;gap:38px;position:relative}
.hero-copy{position:relative;z-index:2;padding-bottom:40px}
.hero-kicker{display:flex;align-items:center;gap:12px;color:#e0c58b;font-weight:700;font-size:12px;margin-bottom:22px}
.thin-line{width:35px;height:2px;background:var(--gold-500)}
.hero-copy h1{font-size:clamp(42px,4.65vw,66px);font-weight:800;color:#fff;line-height:1.35;letter-spacing:-.06em;margin-bottom:27px}
.hero-copy h1 em,.dark-band-grid h2 em,.page-hero h1 em{font-style:normal;color:#dfbb6d}
.hero-lead{color:#d3e1d8;font-size:16px;line-height:2.08;max-width:630px;margin-bottom:30px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero-caption{display:flex;align-items:center;gap:8px;color:#b7d0c2;font-size:11.7px;margin-top:32px}
.hero-caption svg{color:#d3b16c;flex-shrink:0}
.hero-art{min-height:515px;position:relative;display:flex;align-items:center;justify-content:center}
.hero-art-circle{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:440px;height:440px;border-radius:50%}
.hero-art-circle-1{background:linear-gradient(140deg,#255f493b,#dfb75818);border:1px solid #ffffff16;box-shadow:inset 0 0 70px #ffffff05,0 0 150px #cdac3421}
.hero-art-circle-2{width:340px;height:340px;background:radial-gradient(circle,#ffffff12,transparent 75%);border:1px dashed #e6c88635}
.hero-orbit{position:absolute;border:1px dashed #cbb06b3f;border-radius:50%;width:520px;height:400px;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-19deg)}
.orbit-two{width:395px;height:540px;transform:translate(-50%,-50%) rotate(-19deg);opacity:.5}
.brand-art{position:relative;z-index:2;width:min(370px,86%);transform:translateY(-12px);filter:drop-shadow(0 18px 25px #00000018)}
.brand-art img{width:100%;height:auto;object-fit:contain}
.orbit-label{position:absolute;display:flex;align-items:center;gap:8px;background:#ffffffed;box-shadow:0 18px 45px #032b2240;backdrop-filter:blur(4px);border:1px solid #ffffffa8;color:var(--green-900);border-radius:12px;padding:10px 13px;font-size:11.2px;font-weight:800;white-space:nowrap;z-index:3}
.orbit-label svg{color:var(--gold-700);width:18px;height:18px}
.label-top{top:41px;right:-3px}
.label-bottom{bottom:50px;right:12px}
.label-side{left:-25px;top:53%}
.hero-bottom{position:relative;border-top:1px solid #ffffff26;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:21px;padding:21px 0;color:#dae4da;font-size:12px}
.hero-bottom .separator{color:#cda75a;font-size:10px}
.numbers-band{background:#fffcf6;padding:29px 0 21px;border-bottom:1px solid #f0e6d2}
.numbers-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini-stat{display:flex;flex-direction:column;align-items:center;text-align:center;padding:3px 12px;border-left:1px solid #dfdfd4}
.mini-stat:last-child{border:0}
.mini-stat strong{color:var(--green-800);font:800 38px/1.3 var(--font)}
.mini-stat span{font-size:13px;color:var(--ink);font-weight:700}
.mini-stat small{font-size:11px;color:var(--muted)}
.numbers-note{text-align:center;color:var(--muted);font-size:11px;margin:18px 10px 0}
/* Library */
.split-feature,.editorial-split,.two-col-info{display:grid;grid-template-columns:1fr 1fr;gap:7%;align-items:center}
.split-copy p,.editorial-copy p,.two-col-info p{font-size:15px;line-height:2.15}
.ticks{list-style:none;margin:17px 0 27px;padding:0}
.ticks li{display:flex;align-items:flex-start;gap:10px;margin:8px 0;font-size:13.7px;color:#466156}
.ticks svg{color:var(--green-700);flex:0 0 auto;margin-top:5px}
.library-visual{height:420px;position:relative;border-radius:28px;overflow:hidden;padding:32px;background:radial-gradient(circle at 85% 14%,#427c6144,transparent 49%),linear-gradient(148deg,#0e4e3b,#072c26);box-shadow:0 24px 60px #0b3d3035;color:#fff}
.library-visual:before{content:'';position:absolute;width:330px;height:330px;bottom:-210px;left:-110px;border:1px solid #dfc07544;border-radius:50%}
.visual-topline{display:flex;justify-content:space-between;gap:10px;font-weight:800;color:#fff;font-size:14px;position:relative;z-index:2}
.visual-topline span{color:#d6bb76;font-weight:500;font-size:10px}
.book-stack{display:flex;gap:13px;align-items:end;justify-content:center;position:absolute;top:110px;left:30px;right:30px;height:170px;transform:perspective(900px) rotateY(-6deg)}
.book-stack span{width:45px;border-radius:6px 6px 3px 3px;background:#a6bba5;box-shadow:inset 4px 0 0 #fff4,-5px 12px 0 #001d1844;position:relative}
.book-stack span:before{content:'';position:absolute;height:3px;top:19px;right:7px;left:7px;background:#e8d4aa}
.book-stack span:nth-child(1){height:122px;background:#b0c6b4}
.book-stack span:nth-child(2){height:157px;background:#cbaa64}
.book-stack span:nth-child(3){height:141px;background:#7ba28b}
.book-stack span:nth-child(4){height:176px;background:#d3ba78}
.book-stack span:nth-child(5){height:115px;background:#cfdfc3}
.visual-orb{position:absolute;top:138px;left:45%;background:#ffffff18;color:#fff;border:1px solid #ffffff42;border-radius:50%;width:95px;height:95px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);backdrop-filter:blur(10px)}
.library-quote{position:absolute;bottom:71px;left:37px;right:37px;text-align:center;font-size:14px;font-weight:700;color:#f5e9cc}
.library-visual-footer{position:absolute;bottom:25px;right:25px;left:25px;text-align:center;color:#bad7c8;font-size:11px}
.library-visual-footer span{color:#d9b966;margin:0 10px}
.domain-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.domain-tile{background:#fff;border:1px solid #d7e6db;padding:22px;border-radius:17px;min-height:168px;position:relative;transition:transform .2s,box-shadow .2s}
.domain-tile:hover{transform:translateY(-5px);box-shadow:var(--shadow-small)}
.domain-tile>span{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#0d6043;background:#e5f1e9}
.domain-tile small{color:#a67d2a;display:block;font-size:11px;margin-top:8px}
.domain-tile h3{font-size:17px;margin:5px 0 0}
.domain-tile>svg{position:absolute;left:22px;bottom:23px;color:#a17b2c}
/* Editorial */
.mag-cover{min-height:445px;width:min(430px,100%);margin-inline:auto;background:linear-gradient(148deg,#124c3c 0%,#073428 65%,#06271f 100%);color:#fff;border-radius:10px;box-shadow:18px 19px 0 #eddcae,0 23px 50px #0d362b35;padding:28px 32px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.mag-cover:after{content:'';width:330px;height:330px;position:absolute;top:80px;left:-115px;border:1px solid #d4b56d4d;border-radius:50%}
.mag-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;color:#d8bd7e;position:relative;z-index:1}
.mag-eyebrow{font-size:11px;letter-spacing:.1em;color:#e3d0a2;margin-top:34px}
.mag-cover-art{display:flex;color:#deb961;align-items:center;justify-content:center;min-height:142px}
.mag-cover h3{font-size:38px;color:#fff;line-height:1.3;margin:0 0 auto;position:relative;z-index:1}
.mag-bottom{color:#e2cca0;border-top:1px solid #d3ba7370;padding-top:16px;font-size:12px;margin-top:20px}
.editorial-points{display:grid;gap:13px;margin:24px 0}
.editorial-points>div{display:flex;align-items:center;gap:13px;font-size:14px;font-weight:600}
.editorial-points svg{color:var(--gold-700)}
.section-dark-band{background:var(--green-950);color:#fff;overflow:hidden}
.dark-band-grid{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:50px}
.dark-band-grid h2{color:#fff;font-size:clamp(30px,3.5vw,44px);line-height:1.5;margin:10px 0 18px}
.dark-band-grid p{color:#cddfd1;max-width:700px}
.dark-band-emblem{width:min(300px,100%);height:300px;border:1px solid #d7bf7b48;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;margin:auto;color:#edc572;position:relative}
.dark-band-emblem:before{content:'';position:absolute;inset:18px;border:1px dashed #e4cb8d43;border-radius:50%}
.dark-band-emblem div{color:#f2e5c4;font-weight:700;font-size:15px}
.dark-band-emblem span{color:#be9652;padding:0 4px}
.home-initiative-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.home-initiative{display:flex;align-items:flex-start;gap:18px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:23px;transition:.2s}
.home-initiative:hover{transform:translateY(-4px);box-shadow:var(--shadow-small)}
.home-initiative>span{display:grid;place-items:center;background:var(--green-100);color:var(--green-800);width:51px;height:51px;flex-shrink:0;border-radius:12px}
.home-initiative>div{flex:1}
.home-initiative small{font-size:11px;color:var(--gold-800);font-weight:800}
.home-initiative h3{font-size:17px;margin:4px 0 6px}
.home-initiative p{font-size:12.5px;line-height:1.85;margin:0}
.home-initiative>svg{color:var(--gold-800);flex-shrink:0;margin-top:15px}
.audience-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}
.audience-card{padding:25px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.2s}
.audience-card:hover{border-color:#b7d4c0;transform:translateY(-4px)}
.audience-card>span{color:var(--green-700)}
.audience-card h3{font-size:18px;margin:15px 0 9px}
.audience-card p{font-size:13px}
.audience-card>a{display:flex;align-items:center;gap:7px;color:var(--green-700);font-size:13px;font-weight:800}
.closing-box{display:flex;gap:35px;align-items:center;justify-content:space-between;padding:48px 52px!important;border-radius:24px;background:linear-gradient(122deg,#0c4535,#072d25);color:#fff;position:relative;overflow:hidden}
.closing-box:before{content:'';position:absolute;left:-95px;bottom:-115px;width:330px;height:330px;border:1px solid #d1b26c4a;border-radius:50%}
.closing-box>div{position:relative;z-index:1}
.closing-box h2{font-size:31px;color:#fff;max-width:640px;margin:12px 0}
.closing-box p{color:#d2e3d9;margin:0;max-width:600px}
.closing-box>div:last-child{display:flex;flex-direction:column;gap:12px;min-width:205px}
/* Standard page heading */
.page-hero{background:linear-gradient(112deg,#073328,#11503d);color:#fff;position:relative;overflow:hidden;padding:74px 0 72px}
.page-hero:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 4% 70%,#e3be5617,transparent 27%),radial-gradient(circle at 80% 20%,#ffffff08,transparent 35%)}
.page-hero-inner{display:flex;justify-content:space-between;gap:44px;align-items:center;position:relative;z-index:2}
.page-hero-inner>div:first-child{max-width:775px}
.breadcrumbs{display:flex;align-items:center;gap:8px;color:#cadbd0;font-size:12px;margin-bottom:24px}
.breadcrumbs a:hover{color:#eac979}
.page-hero .eyebrow-light{color:#e3c483}
.page-hero h1{color:#fff;font-size:clamp(32px,4.2vw,53px);line-height:1.42;margin:12px 0 18px}
.page-hero p{color:#d7e4dc;max-width:680px;font-size:15px;line-height:2.05;margin:0}
.page-hero-aside{height:178px;width:178px;min-width:178px;border:1px solid #dfc98c5c;background:#ffffff0a;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#f0d18a;text-align:center}
.page-hero-aside small{font-size:11px;color:#e6ebdf}
/* About */
.about-vision-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.vision-card,.mission-card{padding:39px;border-radius:var(--r);border:1px solid #d5e4d8;background:linear-gradient(150deg,#ebf5ed,#f7fbf8)}
.mission-card{background:linear-gradient(150deg,#fff9e8,#fffdf7);border-color:#f0e3c8}
.vision-card h2,.mission-card h2{font-size:27px;color:var(--green-900);margin:11px 0 14px}
.vision-card p,.mission-card p{font-size:14px;margin:0}
.ethos-box{background:var(--green-100);padding:31px;border:1px solid #d8e4d8;border-radius:var(--r)}
.ethos-step{display:flex;align-items:start;gap:17px;padding:12px 0;border-bottom:1px solid #d3e3d7;font-size:14px}
.ethos-step:last-child{border-bottom:0}
.ethos-step b{font-size:15px;color:var(--gold-800);min-width:27px}
/* Filters / cards */
.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:14px 0 18px}
.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-pill{background:#fff;border:1px solid #d8e1d9;border-radius:100px;font-size:12.5px;color:#527065;font-weight:700;padding:9px 16px;transition:.2s}
.filter-pill:hover{border-color:#6c9b7e}
.filter-pill.selected{background:var(--green-800);color:#fff;border-color:var(--green-800)}
.search-control{display:flex;align-items:center;gap:9px;border:1px solid #d6e0d7;border-radius:12px;background:#fff;padding:4px 14px;color:#789182;min-width:286px}
.search-control input{width:100%;background:transparent;border:0;outline:0;font-size:13px;padding:9px 3px;color:var(--ink)}
.search-control:focus-within{border-color:var(--gold-600);box-shadow:0 0 0 3px #c69a3829}
.result-count{color:var(--muted);font-size:12px;margin-bottom:19px}
.research-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.research-card,.catalog-card,.initiative-card{border-radius:18px;border:1px solid var(--line);background:#fff;padding:25px;display:flex;flex-direction:column;min-width:0;transition:.2s}
.research-card:hover,.catalog-card:hover,.initiative-card:hover{transform:translateY(-4px);border-color:#bad3c3;box-shadow:var(--shadow-small)}
.research-card-top,.initiative-card-top,.catalog-head{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.research-card-icon,.catalog-icon{width:48px;height:48px;border-radius:12px;background:var(--green-100);display:inline-flex;align-items:center;justify-content:center;color:var(--green-700);flex-shrink:0}
.research-num{font-size:12px;color:var(--gold-800);font-weight:800}
.research-cat{font-size:10.5px;color:var(--gold-800);font-weight:800}
.research-card h3,.catalog-card h3,.initiative-card h3{font-size:18px;line-height:1.6;margin:0 0 9px;color:var(--green-950)}
.research-card p,.catalog-card p,.initiative-card p{font-size:13px;line-height:2;margin-bottom:16px;color:var(--text);flex:1}
.research-card-bottom{font-size:11.5px;border-top:1px solid var(--line);padding-top:13px;color:var(--muted)}
.empty-state{grid-column:1/-1;padding:55px 20px;text-align:center;background:var(--green-100);color:var(--green-900);border-radius:18px}
.empty-state svg{color:var(--gold-700);margin:auto}
.empty-state h3{font-size:21px;margin:13px 0 4px}
.empty-state p{font-size:13px}
.library-banner{border-radius:23px;min-height:280px;background:linear-gradient(128deg,#0d4b38,#062e25);display:flex;align-items:center;justify-content:space-between;gap:25px;padding:45px 52px;color:#fff;overflow:hidden}
.library-banner h2{font-size:31px;color:#fff;line-height:1.48;margin:12px 0 14px}
.library-banner p{color:#cbdcd0;max-width:660px;margin:0}
.library-banner-icon{width:160px;height:160px;display:grid;place-items:center;border:1px solid #debb6952;border-radius:50%;color:#dfb96a;flex-shrink:0}
.catalog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}
.catalog-card{padding:25px}
.catalog-head{justify-content:space-between}
.catalog-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--muted)}
.catalog-details{font-size:11.5px;color:#6d8178;margin-bottom:14px}
.catalog-action{display:flex;align-items:center;gap:7px;color:var(--green-700);font-weight:800;font-size:12.5px}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border:1px solid #cde1d2;border-radius:99px;font-size:10px;background:#eef6f0;color:#276e4e;line-height:1.5;font-weight:750;white-space:normal}
.pill-warm{background:#faf0d8;border-color:#e9d39e;color:#8b6420}
.pill-neutral{background:#f4f6f3;border-color:#e1e8e1;color:#617368}
.pill-green{background:#dff2e5;border-color:#bbd9c4;color:#0d6c44}
.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.milestone{text-align:center;padding:28px 16px;background:#fff;border:1px solid #e0e9df;border-radius:16px;display:flex;align-items:center;flex-direction:column;gap:5px}
.milestone span{font-size:12px;color:var(--gold-800);font-weight:700}
.milestone strong{font-size:37px;color:var(--green-800);line-height:1.45}
.milestone small{font-size:11px;color:var(--muted)}
.notice-inline,.disclosure{display:flex;align-items:flex-start;gap:10px;background:var(--gold-100);border:1px solid #eedeba;border-radius:13px;padding:17px 20px;color:#795e28;font-size:12.7px;line-height:1.9;margin-top:24px}
.notice-inline svg,.disclosure svg{flex-shrink:0;margin-top:2px}
/* Magazine */
.publishing-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.publishing-grid>div{background:#f8faf7;border:1px solid var(--line);border-radius:16px;padding:25px}
.publishing-grid strong{color:#ad882b;font-size:21px}
.publishing-grid h3{font-size:18px;margin:13px 0}
.publishing-grid p{font-size:13px;margin:0}
.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.article-card{display:flex;flex-direction:column;overflow:hidden;border-radius:19px;border:1px solid var(--line);background:#fff;transition:.2s}
.article-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.article-illus{height:165px;background:linear-gradient(137deg,#0b4736,#1e7452);color:#eac76f;display:grid;place-items:center}
.article-illus-2{background:linear-gradient(135deg,#ead9b0,#bd9b62);color:#46653e}
.article-illus-3{background:linear-gradient(135deg,#e1eddd,#a7c3a9);color:#1b6142}
.article-body{padding:24px;display:flex;flex-direction:column;flex:1}
.article-body .pill{align-self:start}
.readtime{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin:10px 0}
.article-body h3{font-size:18px;margin:10px 0}
.article-body p{font-size:12.8px;flex:1}
.article-go{color:var(--green-700);font-size:12px;font-weight:800;display:flex;align-items:center;gap:9px}
.reading-layout{display:grid;grid-template-columns:1fr 305px;align-items:start;gap:35px}
.reading-article{padding:33px 36px;border:1px solid var(--line);border-radius:20px;background:#fff}
.article-topline{display:flex;align-items:center;gap:16px;margin-bottom:15px}
.article-topline>span:last-child{color:var(--muted);font-size:12px;display:flex;gap:7px;align-items:center}
.reading-article>p{font-size:16px;line-height:2.35;margin:25px 0}
.reading-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.reading-aside{display:grid;gap:20px}
.aside-block{padding:25px;background:#f5f8f4;border:1px solid var(--line);border-radius:16px}
.aside-block h3{font-size:19px;margin:10px 0 18px}
.aside-block a{display:flex;align-items:center;gap:7px;border-top:1px solid #dce7dc;padding:12px 0;font-weight:700;font-size:13px;color:var(--green-700)}
.aside-gold{background:#f9f2e1;border-color:#e9d9b7}
.aside-block p{font-size:13px}
/* Observatory */
.data-layers,.partner-tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:19px}
.data-layers article,.partner-tracks article{padding:30px;border:1px solid var(--line);border-radius:19px;background:#fff;display:flex;flex-direction:column;align-items:start}
.layer-index{color:var(--gold-800);font-weight:800;font-size:12px}
.layer-icon{color:var(--green-700);padding:16px;border-radius:17px;background:var(--green-100);margin:18px 0 16px}
.data-layers h3,.partner-tracks h3{font-size:21px;margin:10px 0}
.data-layers p,.partner-tracks p{font-size:13.4px;flex:1}
.criteria-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.criteria-grid>div{min-height:110px;background:#fff;border:1px solid #d8e6d8;border-radius:13px;padding:19px;display:flex;flex-direction:column;gap:12px}
.criteria-grid span{color:var(--gold-800);font-size:12px;font-weight:800}
.criteria-grid strong{font-size:16px;color:var(--green-800)}
/* Projects & governance */
.initiative-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.initiative-card-top>span:first-child{width:47px;height:47px;border-radius:14px;background:var(--green-100);display:grid;place-items:center;color:var(--green-800)}
.initiative-type{font-size:11px;color:var(--gold-800);font-weight:750}
.initiative-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--green-700);font-weight:800;font-size:12px}
.muted-note{font-size:11.5px;color:var(--muted);margin:24px 0 0}
.timeline-list{display:grid;gap:10px;max-width:920px;margin:auto}
.timeline-entry{display:flex;gap:20px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px 25px}
.timeline-index{width:46px;height:46px;border-radius:12px;background:var(--green-100);color:var(--green-700);font-size:15px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.timeline-entry small{color:var(--gold-800);font-size:11.5px;font-weight:800}
.timeline-entry h3{font-size:18px;margin:3px 0 6px}
.timeline-entry p{font-size:13px;margin:0}
.governance-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.governance-steps article{background:#fff;border:1px solid var(--line);padding:30px;border-radius:18px}
.governance-steps article:hover{box-shadow:var(--shadow-small)}
.phase-number{font-size:44px;font-weight:800;color:#d3ad5c;line-height:1.15;display:block;margin-bottom:22px}
.governance-steps small{color:var(--muted);font-size:12px}
.governance-steps h3{font-size:20px;margin:9px 0 12px}
.governance-steps p{font-size:13px;margin:0}
.institutional-model{display:grid;grid-template-columns:1fr 170px 1fr;align-items:center;gap:15px}
.institution-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;text-align:center;min-height:260px}
.institution-box>span{display:flex;justify-content:center;color:var(--green-700);margin-bottom:15px}
.institution-box h3{font-size:20px}
.institution-box p{font-size:13px}
.institution-dark{background:var(--green-900);color:#fff}
.institution-dark>span,.institution-dark h3{color:#fff}
.institution-dark p{color:#d8e4d9}
.connection{display:flex;flex-direction:column;align-items:center;color:var(--green-700);font-size:12px;font-weight:800;gap:8px;text-align:center}
.detail-grid{display:grid;grid-template-columns:1fr 310px;gap:32px;align-items:start}
.detail-main{background:#fff;border:1px solid var(--line);padding:33px;border-radius:18px}
.detail-main h2{font-size:27px;margin:10px 0}
.detail-main h3{font-size:20px;margin:25px 0 12px}
.detail-main p{font-size:14px}
.detail-status{display:flex;gap:9px;margin-bottom:20px}
.outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.outcome-grid>div{background:var(--green-100);border:1px solid #dbe8df;border-radius:12px;padding:15px;display:flex;align-items:center;gap:10px;font-size:13px}
.outcome-grid svg{color:var(--green-700);flex-shrink:0}
.detail-box{border-radius:18px;padding:28px;background:#f7f5eb;border:1px solid #e7e0cb;display:flex;flex-direction:column;align-items:start;gap:10px}
.detail-box h3{font-size:21px;margin:0}
.detail-box p{font-size:13px}
/* Donations */
.partner-tracks article>span{color:var(--gold-800);background:var(--gold-100);border-radius:14px;padding:14px;display:grid;place-items:center}
.partner-tracks article a{display:flex;align-items:center;gap:9px;color:var(--green-700);font-weight:800;font-size:13px}
.budget-heading{display:grid;grid-template-columns:1.5fr .7fr;align-items:center;gap:30px;margin-bottom:28px}
.budget-total{border:1px solid #d9e7dc;background:#fff;border-radius:18px;padding:24px;text-align:center;display:flex;flex-direction:column}
.budget-total small{color:var(--muted);font-size:11px}
.budget-total strong{color:var(--green-800);font-size:37px;line-height:1.45}
.budget-total span{font-size:11px;color:var(--muted)}
.budget-items{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.budget-item{padding:22px;background:#fff;border:1px solid var(--line);border-radius:15px}
.budget-item>div:first-child{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12.5px;font-weight:600}
.budget-item strong{color:var(--green-800);font-size:14px}
.bar-track{height:7px;background:#e7eee7;border-radius:99px;overflow:hidden;margin-top:18px}
.bar-track span{display:block;height:100%;background:linear-gradient(90deg,var(--green-700),var(--gold-500));border-radius:99px}
/* Contact */
.contact-layout{display:grid;grid-template-columns:1fr 330px;align-items:start;gap:30px}
.contact-form-box{border:1px solid var(--line);border-radius:20px;padding:34px 37px;background:#fff}
.contact-form-box h2{font-size:27px;margin:8px 0}
.contact-form-box>p{font-size:13px;color:var(--muted);margin-bottom:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.form-grid label,.contact-form-box label,.admin-login label{display:flex;flex-direction:column;color:#365448;font-size:13px;font-weight:700;gap:7px}
.form-grid label>span{color:#b78324}
.form-grid input,.form-grid select,.contact-form-box textarea,.admin-login input{width:100%;background:#fbfcfa;border:1px solid #d6e2d8;border-radius:11px;min-height:49px;padding:11px 13px;outline:0;color:var(--ink);transition:.2s}
.form-grid input:focus,.form-grid select:focus,.contact-form-box textarea:focus,.admin-login input:focus{border-color:var(--gold-600);box-shadow:0 0 0 3px #ceaa5033}
.contact-form-box textarea{min-height:152px;resize:vertical}
.contact-form-box label{margin-top:17px}
.contact-form-box .form-grid label{margin:0}
.consent{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:9px!important;font-size:12px!important;line-height:1.9;margin:18px 0 18px}
.consent input{accent-color:var(--green-700);margin-top:7px}
.form-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-top:18px}
.form-bottom>small{color:var(--muted);font-size:11px}
.contact-aside{display:grid;gap:17px}
.contact-aside .aside-block h3{margin-top:10px}
.contact-aside .aside-block p{line-height:2}
.honeypot{position:absolute!important;top:-9999px!important;left:-9999px!important;height:0!important;width:0!important;opacity:0!important;overflow:hidden}
.form-feedback{margin-top:22px}
.feedback-error,.feedback-pending,.feedback-success,.feedback-local{padding:15px;border:1px solid #e8d6b5;background:#fff8e8;color:#765a2c;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:12px}
.feedback-success{border-color:#b6dabc;background:#e9f7ed;color:#20583d}
.feedback-error{border-color:#e9bdbc;background:#fff0ef;color:#99362f}
.policy-text{max-width:895px}
.policy-text h2{font-size:21px;color:var(--green-900);margin:24px 0 8px}
.policy-text p{font-size:14px;line-height:2.3}
/* Admin */
.admin-shell{max-width:1100px}
.admin-login{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px;max-width:490px;display:grid;gap:17px}
.admin-login h2{font-size:22px;margin:0}
.admin-login p{font-size:13px;margin:0}
.admin-login label{margin:0}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
.admin-top h2{font-size:24px;margin:0}
.admin-table-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.admin-table{border-collapse:collapse;width:100%;min-width:820px}
.admin-table th,.admin-table td{padding:13px;text-align:right;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}
.admin-table th{background:#eef5ed;color:var(--green-900);font-weight:800}
.admin-table tr:last-child td{border:0}
.admin-table .message-col{min-width:230px;max-width:350px;overflow-wrap:anywhere}
/* FAQ */
.faq-list{display:grid;gap:14px}
.faq-list details{background:#fff;border:1px solid var(--line);padding:17px 24px;border-radius:14px}
.faq-list summary{font-size:15px;font-weight:800;cursor:pointer;color:var(--green-900)}
.faq-list details p{font-size:13px;margin:12px 0 0}
/* Footer */
.footer{background:#062b23;color:#e4efe7;padding:70px 0 0}
.footer-grid{display:grid;grid-template-columns:1.65fr 1fr 1fr 1fr;gap:35px;padding-bottom:54px}
.footer-brand{max-width:355px}
.footer-logo{display:flex;gap:12px;align-items:center;margin-bottom:17px}
.footer-logo strong{font-size:16px;display:block}
.footer-logo small{display:block;font-size:10px;color:#bcbf9c;line-height:1.6}
.footer-brand p{color:#b5d0c0;font-size:12.5px;line-height:2.1}
.footer-outline{border:1px solid #c7ae6f5e;border-radius:9px;padding:7px 11px;display:inline-flex;align-items:center;gap:7px;color:#e0c986;font-size:11px}
.footer-grid h3{font-size:15px;margin:9px 0 18px;color:#ead6a0}
.footer-grid>div:not(:first-child)>a{display:flex;align-items:center;gap:7px;color:#bdd4c5;font-size:12.5px;padding:6px 0;transition:color .2s}
.footer-grid>div:not(:first-child)>a:hover{color:#fff}
.footer-sub{font-size:12px;color:#afc9b9}
.footer-grid .footer-download{color:#e8d3a5!important}
.footer-grid .footer-contact{color:#fff!important;font-weight:700}
.footer-bottom{border-top:1px solid #ffffff23;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:25px;color:#9bb8a8;font-size:11px}
.footer-bottom>div{display:flex;align-items:center;gap:20px}
.footer-bottom a:hover{color:#fff}
.toast{position:fixed;left:27px;bottom:24px;z-index:110;max-width:min(450px,calc(100% - 54px));background:var(--green-900);color:#fff;border-radius:12px;box-shadow:0 15px 55px #061f1a45;padding:13px 20px;font-size:13px;line-height:1.8;opacity:0;pointer-events:none;transform:translateY(16px);transition:.25s}
.toast.is-visible{opacity:1;transform:translateY(0)}
.toast-error{background:#8f332b}
.initial-loading,.no-js{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--green-900)}
@media(max-width:1199px){
 .desktop-nav{display:none}.mobile-toggle{display:inline-flex}.header{height:80px}
 .mobile-shade{display:block;position:fixed;z-index:45;inset:118px 0 0;background:#061d178a;opacity:0;visibility:hidden;transition:.25s;backdrop-filter:blur(3px)}
 .mobile-shade.shown{opacity:1;visibility:visible}
 .mobile-nav{display:flex;flex-direction:column;position:fixed;z-index:46;top:118px;bottom:0;right:0;width:min(360px,91vw);padding:18px;overflow-y:auto;background:#fff;transform:translateX(105%);transition:.28s;box-shadow:-15px 8px 40px #072e2632}
 .mobile-nav.shown{transform:translateX(0)}
 .mobile-nav .nav-link{padding:13px 18px;border-bottom:1px solid var(--line);border-radius:0;font-size:15px}
 .mobile-download{margin-top:20px;border-radius:10px;background:var(--green-900);color:#fff;font-size:14px;font-weight:700;padding:12px 16px;display:flex;align-items:center;gap:9px}
}
@media(max-width:1040px){
 .container{width:min(100% - 52px,850px)}
 .hero-grid{grid-template-columns:1fr 1fr;gap:0}
 .hero-copy h1{font-size:46px}.hero-lead{font-size:14px}
 .hero-art-circle-1{width:340px;height:340px}.hero-art-circle-2{width:270px;height:270px}
 .hero-orbit{width:360px;height:330px}.orbit-two{width:330px;height:400px}
 .orbit-label{font-size:10px}.label-top{right:0}.label-side{left:-6px}
 .section{padding:74px 0}.value-grid,.audience-grid{grid-template-columns:repeat(2,1fr)}
 .budget-items,.research-grid,.initiative-grid{grid-template-columns:repeat(2,1fr)}
 .footer-grid{grid-template-columns:1.6fr 1fr 1fr}.footer-grid>div:last-child{grid-column:1/-1}
}
@media(max-width:760px){
 body{font-size:14px}.container{width:calc(100% - 36px)}
 .ann-inner{min-height:42px;gap:9px;font-size:10px}.ann-inner a{font-size:10px}
 .header{height:73px}.brand{min-width:0}.brand img{width:46px;height:46px}.brand strong{font-size:13px}.brand small{font-size:9.5px}
 .top-partner{display:none}.mobile-nav{top:115px}.mobile-shade{top:115px}
 .home-hero{padding-top:48px}.hero-grid{display:flex;flex-direction:column;gap:0;text-align:right;min-height:auto}
 .hero-copy{padding:0}.hero-copy h1{font-size:clamp(36px,8.7vw,56px);margin-bottom:22px}.hero-lead{font-size:14px}
 .hero-art{width:100%;min-height:370px;margin-top:8px;max-width:470px}
 .hero-art-circle-1{width:305px;height:305px}.hero-art-circle-2{width:240px;height:240px}
 .hero-orbit{width:340px;height:290px}.orbit-two{width:300px;height:380px}
 .brand-art{width:220px}.orbit-label{font-size:10px;padding:8px 10px}

function about(){return pageHero('عن المركز','بيتٌ للمعرفة،<br/><em>ومرجعٌ للعمل الإنساني.</em>','تصور مؤسسي يقيم صلة مستدامة بين التراث العلمي الإسلامي، واحتياجات القطاع المعاصرة، والمعايير المهنية العالمية.',`${icon('book-open',66)}<small>علمٌ موثّق</small>`)+`<section class="section"><div class="container about-vision-grid"><div class="vision-card"><span class="eyebrow">رؤيتنا</span><h2>مرجعية رائدة في دراسات الأيتام ورعايتهم وتنميتهم.</h2><p>نسعى لأن نصبح مرجعًا علميًا واستراتيجيًا إقليميًا ودوليًا، يُقاس دوره بجودة الأدلة والإسهام في تحسين السياسات والممارسات، لا بادعاء مكانة متحققة قبل تأسيس المؤسسة.</p></div><div class="mission-card"><span class="eyebrow">رسالتنا</span><h2>دراسات تتحول إلى قرارات وبرامج قابلة للتقييم.</h2><p>إنتاج بحوث علمية وتطبيقية واستشارات وأدوات معرفة تعزز الكرامة والاستقلالية والاندماج، وتعين المؤسسات على تحسين جودة حياة الأطفال والأسر.</p></div></div></section><section class="section section-soft"><div class="container">${secHead('المبادئ المؤسسة','أربع قيم تحكم <span class="em-green">كل ما نفعل.</span>','المصلحة الفضلى للطفل والصدق العلمي لا يتعارضان مع الطموح المؤسسي.') }<div class="features-grid value-grid">${D.values.map(feature).join('')}</div></div></section><section class="section"><div class="container"><div class="two-col-info"><div><span class="eyebrow">مرجعية عملنا</span><h2>تأصيل إسلامي، واستفادة نقدية من الخبرة الدولية.</h2><p>يحضر القرآن والسنة الصحيحة والفقه الإسلامي ومقاصد الشريعة والخبرة التاريخية للأوقاف والتكافل كمنابع أساسية للأسئلة البحثية، ويُستفاد من الأدلة والتقييمات الدولية بمراجعة منهجية وسياقية مسؤولة.</p><p>يفصل المركز بين البحث العلمي والفتوى، وبين المعرفة العامة والإدارة المباشرة لحالات الأطفال، وبين الشراكة العلمية والتبعية التحريرية.</p>${btn('#/governance','الاطلاع على الحوكمة','primary','arrow')}</div><div class="ethos-box"><span class="eyebrow">سلسلة الأثر</span><div class="ethos-step"><b>01</b><span>تحديد السؤال واحتياج القطاع</span></div><div class="ethos-step"><b>02</b><span>بحث وتوثيق وتحليل محايد</span></div><div class="ethos-step"><b>03</b><span>توصيات وسياسات وتجارب محدودة</span></div><div class="ethos-step"><b>04</b><span>قياس الاستخدام والنتائج والتعلم</span></div></div></div></div></section><section class="section section-lightgreen"><div class="container">${secHead('من تشملهم الدراسات؟','توسّعٌ منضبط في العدسة، <span class="em-green">لا خلطٌ في المفاهيم.</span>','تبقى قضايا الأيتام جوهر المركز، وتُدرَس أوضاع فقد الرعاية الأبويّة المتصلة بها بوصفها مجالًا مكملًا.') }<div class="care-grid"><article><span>01</span><h3>الأطفال الأيتام</h3><p>فقد الأب أو أحد الوالدين وفق التعريف البحثي أو التشريعي المعتمد في كل دراسة.</p></article><article><span>02</span><h3>مجهولو الوالدين والنسب</h3><p>حماية الهوية والحقوق والرعاية الأسرية البديلة ضمن التشريعات المختصة.</p></article><article><span>03</span><h3>الأطفال المتأثرون بغياب الرعاية</h3><p>بما يشمل بعض الأطفال بعد الطلاق أو الانفصال عند ضعف الرعاية الفعلية، دون اعتبار أبناء المطلقات أيتامًا تلقائيًا.</p></article><article><span>04</span><h3>الأطفال في أوضاع الشارع</h3><p>دراسة المخاطر والخدمات والدعم الأسري والمجتمعي دون اختزال أو وصم.</p></article></div><div class="notice-inline">${icon('shield',23)} هذه الفئات لا تُدمج في تعريف قانوني واحد، ولا تُستخدم هوية الطفل أو قصته الشخصية للتسويق أو جمع التمويل.</div></div></section><section class="section"><div class="container">${secHead('لمن نعمل','المعرفة التي تخدم <span class="em-green">أكثر من طرف.</span>')} ${audienceCards()}</div></section><section class="section section-soft"><div class="container">${secHead('تساؤلات أساسية','أسئلة شائعة قبل <span class="em-green">بدء التعاون.</span>')}<div class="faq-list">${D.faq.map((x,i)=>`<details ${i===0?'open':''}><summary>${esc(x.q)}${icon('chevron',18)}</summary><p>${esc(x.a)}</p></details>`).join('')}</div></div></section>`;}
function researchCard(d){return `<article class="research-card"><div class="research-card-top"><span class="research-card-icon">${icon(d.icon,23)}</span><span class="research-num">${String(d.id).padStart(2,'0')} / 16</span></div><span class="research-cat">${esc(d.category)}</span><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p><div class="research-card-bottom"><strong>مخرج مستهدف</strong><span>${esc(d.output)}</span></div></article>`;}
function researchList(){let q=researchQuery.trim().toLowerCase();return D.domains.filter(o=>(filterDomain==='الكل'||o.category===filterDomain)&&(!q||(o.title+' '+o.desc+' '+o.output).toLowerCase().includes(q)));}
function research(){let x=researchList();return pageHero('الدراسات والأبحاث','أسئلة علمية،<br/><em>ومسارات عمل قابلة للتطبيق.</em>','16 مجالًا بحثيًا مترابطًا يغطي حياة اليتيم وسياقاته، من الحقوق والأسرة إلى التعليم والتشغيل والاستدامة والاستشراف.',`${icon('microscope',62)}<small>أبحاث مسؤولة</small>`)+`<section class="section"><div class="container"><div class="filter-bar"><div class="tabs" role="group" aria-label="تصفية المجالات">${['الكل','الحقوق والأسرة','التمكين والمستقبل'].map(c=>`<button class="filter-pill ${filterDomain===c?'selected':''}" type="button" data-action="domain-filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><label class="search-control">${icon('search',20)}<span class="sr-only">ابحث في المجالات البحثية</span><input id="research-search" type="search" placeholder="ابحث عن مجال أو كلمة..." value="${attr(researchQuery)}" autocomplete="off"/></label></div><div class="result-count" id="research-count">${x.length} من أصل 16 مجالًا في الخطة</div><div class="research-grid" id="research-list">${x.map(researchCard).join('')||empty()}</div></div></section><section class="section section-soft"><div class="container"><div class="two-col-info"><div><span class="eyebrow">البحث ذو المعنى</span><h2>من جمع المعلومات إلى تحسين القرار.</h2><p>تعمل الأجندة المقترحة عبر مراجعات أدبيات ومسوحات خدمات وتقييمات برامج ومقارنات تشريعية وأوراق سياسات، مع مراجعة أخلاقية مستقلة عند الحاجة.</p><ul class="ticks"><li>${icon('check',18)} دراسة الاحتياج قبل اختيار التدخل</li><li>${icon('check',18)} منهجية قابلة للمراجعة والنقد</li><li>${icon('check',18)} نشر حدود النتائج والتوصيات بوضوح</li></ul></div><div class="ethos-box"><span class="eyebrow">أولويات بحثية مبدئية</span>${['خريطة الأدبيات العربية والإسلامية في رعاية الأيتام','دليل مفاهيم اليتم وفقد الرعاية وأوضاع الشارع','دراسة الانتقال من الكفالة إلى الاستقلال','حوكمة بيانات خدمات الرعاية','دعم الأسر عند ضعف الرعاية الأبوية','نماذج الوقف التعليمي المستدام'].map((t,i)=>`<div class="ethos-step"><b>${String(i+1).padStart(2,'0')}</b><span>${t}</span></div>`).join('')}</div></div></div></section><section class="section"><div class="container closing-box"><div><span class="eyebrow eyebrow-gold">دعوة للتعاون العلمي</span><h2>هل لديك سؤال بحثي أو شراكة أكاديمية؟</h2><p>يمكنك عرض فكرة دراسة أو اقتراح لجنة علمية ومشاركة مصادر مرخصة ضمن الأولويات المعتمدة لاحقًا.</p></div><div>${btn('#/contact','تقديم مقترح بحثي','gold','arrow')}</div></div></section>`;}
function catalogCard(b){let isExternal=/^https?:/.test(b.href);return `<article class="catalog-card"><div class="catalog-head"><span class="catalog-icon">${icon(b.type==='مشروع دراسة'?'compass':'book',25)}</span>${pill(b.status,b.status==='متاح'?'pill-green':b.status==='قيد التخطيط'?'pill-neutral':'pill-warm')}</div><div class="catalog-meta">${esc(b.type)} <span>•</span> ${esc(b.year)}</div><h3>${esc(b.title)}</h3><p>${esc(b.desc)}</p><div class="catalog-details"><span>${icon('users',16)} ${esc(b.author)}</span><span>${icon('globe',16)} ${esc(b.lang)}</span></div><div class="catalog-action">${b.href?`<a ${visit(b.href)}>${isExternal?'عرض المصدر الخارجي':'فتح الوثيقة'} ${icon(isExternal?'external':'arrow',17)}</a>`:`<span class="not-ready">قيد الإعداد — لا يوجد ملف منشور</span>`}</div></article>`;}
function getCatalog(){let q=catalogQuery.trim().toLowerCase();return allCatalog().filter(b=>(filterCatalog==='الكل'||b.scope===filterCatalog)&&(!q||(b.title+' '+b.author+' '+b.desc+' '+b.type).toLowerCase().includes(q)));}
function library(){let list=getCatalog();return pageHero('مكتبة محمد شندي الراوي','بيتٌ للذاكرة،<br/><em>ومساحةٌ للبحث والمستقبل.</em>','مكتبة متخصصة ومشروع معرفي طويل الأمد، يبدأ بفهرس موثّق ويتوسع عبر الأجيال، مع حقوق نشر واضحة وإتاحة تحفظ الخصوصية.',`${icon('book-open',68)}<small>المشروع المعرفي المؤسس</small>`)+`<section class="section"><div class="container"><div class="library-banner"><div><span class="eyebrow eyebrow-gold">مكتبة محمد شندي الراوي</span><h2>من مجموعات صغيرة موثقة<br/>إلى مرجع معرفي مستدام.</h2><p>نؤمن أن المكتبة ليست مستودع ملفات، بل بنية مستقلة لحفظ المصدر والتحقق من أصالته وتيسير الوصول إليه عبر الزمن.</p></div><div class="library-banner-icon">${icon('book-open',100)}</div></div></div></section><section class="section section-soft"><div class="container">${secHead('واجهة المكتبة التجريبية','تصفّح <span class="em-green">المصادر المتاحة.</span>','فهرس أولي يضم مراجع عامة ومواد توضِيحية؛ ويمكن إضافة مصادر مرخّصة عبر لوحة التحرير بعد التحقق من الحقوق.') }<div class="filter-bar"><div class="tabs" role="group" aria-label="تصفية الفهرس">${['الكل','المركز','حماية الطفل','قياس الأثر','المكتبات','التأصيل الإسلامي'].map(c=>`<button class="filter-pill ${filterCatalog===c?'selected':''}" type="button" data-action="catalog-filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><label class="search-control">${icon('search',20)}<span class="sr-only">ابحث في فهرس المكتبة</span><input id="catalog-search" type="search" placeholder="عنوان، مؤلف، موضوع..." value="${attr(catalogQuery)}" autocomplete="off"/></label></div><div class="result-count" id="catalog-count">${list.length} مواد مفهرسة</div><div class="catalog-grid" id="catalog-list">${list.map(catalogCard).join('')||empty()}</div></div></section><section class="section"><div class="container">${secHead('ماذا ستقدم المكتبة','ستة منتجات <span class="em-green">معرفية مترابطة.</span>','كل منتج قابل للنمو تدريجيًا وفق الموارد والحقوق ومستوى الاعتماد.') }<div class="features-grid library-products">${D.libraryProducts.map(feature).join('')}</div></div></section><section class="section section-soft"><div class="container">${secHead('خارطة تنمية المجموعات','أهداف تدريجية <span class="em-green">وليست أرقامًا محققة.</span>','أولوية للجودة وحقوق النشر والحفظ، لا للتضخم العددي.') }<div class="milestones">${D.libraryMilestones.map(m=>`<div class="milestone"><span>${esc(m.period)}</span><strong>${esc(m.value)}</strong><small>${esc(m.metric)}</small></div>`).join('')}</div><div class="notice-inline">${icon('lock',20)} لا تُنشر بيانات الحالات الفردية في فهرس المكتبة أو أرشيفها العام، وتخضع المواد الأرشيفية لضبط الحقوق والإتاحة.</div></div></section>`;}
function publications(){return pageHero('المجلة والإصدارات','فكرةٌ تُكتب،<br/><em>ومعرفةٌ تُتداول بمسؤولية.</em>','مجلّة شهرية معرفية مقترحة تجمع بين الدراسات والمقالات والمراجعات العلمية وأخبار قطاع الرعاية، مع مسار تدريجي نحو النشر المحكّم.',`${icon('newspaper',65)}<small>نافذة تحريرية مستقلة</small>`)+`<section class="section"><div class="container editorial-split"><div class="mag-cover"><div class="mag-top"><span>مجلة المركز</span><span>التصور التمهيدي</span></div><span class="mag-eyebrow">العلم • التوثيق • الأثر</span><div class="mag-cover-art">${icon('newspaper',92)}</div><h3>${D.issue.title.replace(' إلى ','<br/>إلى ')}</h3><span class="mag-bottom">نموذج عدد مقترح — ليس إصدارًا منشورًا</span></div><div class="editorial-copy"><span class="eyebrow">نموذج التحرير</span><h2>${esc(D.issue.title)}</h2><p>${esc(D.issue.intro)}</p><div class="disclosure">${icon('alert',20)} المواد الموسومة بأنها نماذج توضيحية ليست أبحاثًا محكّمة وليست أعدادًا منشورة؛ ويمكن إدراج مواد جديدة بمراجعة تحريرية عبر الإدارة.</div><ul class="ticks"><li>${icon('check',18)} ملف العدد: سؤال بحثي مركزي</li><li>${icon('check',18)} بحث في خمس دقائق وقراءات من المكتبة</li><li>${icon('check',18)} التراث الإسلامي والخبرة الدولية</li><li>${icon('check',18)} ابتكارات ونافذة على واقع المؤسسات</li></ul></div></div></section><section class="section section-soft"><div class="container">${secHead('من مواد العدد المقترح','اقرأ <span class="em-green">نماذج المقالات.</span>','نماذج للقراءة، ومعها المقالات التي يعتمد مسؤول التحرير نشرها عبر الإدارة؛ ولا يعني إدراجها تحكيمًا علميًا.') }<div class="article-grid">${allArticles().map((a,i)=>`<a href="#/article/${a.slug}" class="article-card"><div class="article-illus article-illus-${i+1}">${icon(['book-open','heart','archive'][i%3],56)}</div><div class="article-body">${pill(a.tag,'pill-neutral')}<span class="readtime">${icon('clock',15)} ${a.read}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt)}</p><div class="article-go">قراءة المادة ${icon('arrow',17)}</div></div></a>`).join('')}</div></div></section><section class="section"><div class="container">${secHead('هيكل النشر','أربعة مستويات <span class="em-green">توثيقية واضحة.</span>')}<div class="publishing-grid">${[{num:'01',title:'مقال تحليلي',desc:'طرح فكري وتفسيري موثق مع تمييز الرأي من الحقيقة.'},{num:'02',title:'موجز سياسات',desc:'توصيات قابلة للاختبار موجّهة لصناع القرار.'},{num:'03',title:'ورقة بحث',desc:'منهجية معلنة ومراجعة تخصصية وفق معايير النشر.'},{num:'04',title:'خبر قطاعي',desc:'خبر موثق المصدر يحفظ خصوصية الأفراد.'}].map(o=>`<div><strong>${o.num}</strong><h3>${o.title}</h3><p>${o.desc}</p></div>`).join('')}</div></div></section>`;}
function article(slug){const a=allArticles().find(x=>x.slug===slug);if(!a)return notFound();return pageHero(a.isLive?'المجلة — مادة منشورة':'مجلة المركز — نموذج تحريري',esc(a.title),a.excerpt,`${icon('newspaper',58)}<small>${a.read}</small>`)+`<section class="section"><div class="container reading-layout"><article class="reading-article"><div class="article-topline">${pill(a.tag,'pill-warm')}<span>${icon('clock',16)} ${esc(a.read)}</span></div><div class="disclosure">${icon('alert',20)} ${a.isLive?"مادة نُشرت عبر لوحة تحرير الموقع. النشر الإلكتروني لا يعني تحكيمًا علميًا إلا إذا ذُكر ذلك صراحة.":"مادة تحريرية تمثيلية في مرحلة التأسيس، غير منشورة أو محكّمة باسم جهة قائمة."}</div>${a.body.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="reading-actions"><button type="button" class="btn btn-primary" data-action="share">مشاركة الصفحة ${icon('arrow-up',16)}</button><a href="#/publications" class="btn btn-outline">العودة للمجلة ${icon('arrow',16)}</a></div></article><aside class="reading-aside"><div class="aside-block"><span class="eyebrow">استكشف المزيد</span><h3>موضوعات متصلة</h3>${allArticles().filter(x=>x.slug!==slug).slice(0,5).map(x=>`<a href="#/article/${x.slug}">${esc(x.title)} ${icon('arrow',16)}</a>`).join('')}</div><div class="aside-block aside-gold"><h3>مكتبة محمد شندي الراوي</h3><p>انتقل من المقال إلى المصادر والأدلة المتخصصة.</p><a href="#/library">تصفح المكتبة ${icon('arrow',16)}</a></div></aside></div></section>`;}
function observatory(){return pageHero('المرصد وقاعدة المعرفة','بياناتٌ تساعد على الفهم.<br/><em>ولا تكشف هوية أحد.</em>','مرصد معرفة قطاعية مقترح يجمع بين القواميس والمصادر والإحصاءات المجمّعة والتحليل؛ لا يحلّ محل أنظمة إدارة الحالات لدى الجهات المختصة.',`${icon('chart',70)}<small>الخصوصية منذ التصميم</small>`)+`<section class="section"><div class="container">${secHead('نموذج عمل المرصد','ثلاث طبقات، <span class="em-green">وحدود أخلاقية واضحة.</span>','لا يُعرض في هذه النسخة أي رقم فعلي عن الأطفال أو الحالات؛ فلا توجد بيانات ميدانية معتمدة في الموقع.') }<div class="data-layers"><article><span class="layer-index">الطبقة 01</span><span class="layer-icon">${icon('globe',32)}</span><h3>معرفة عامة</h3><p>أبحاث منشورة ومؤشرات إجمالية آمنة وبيانات وصفية وروابط لمصادر موثوقة.</p>${pill('متاحة وفق الحقوق','pill-green')}</article><article><span class="layer-index">الطبقة 02</span><span class="layer-icon">${icon('lock',32)}</span><h3>بيانات بحث مقيدة</h3><p>بيانات لأبحاث محددة بعد مراجعة أخلاقية واتفاقيات وصول وإزالة تعريف قوية.</p>${pill('إتاحة بشروط','pill-warm')}</article><article><span class="layer-index">الطبقة 03</span><span class="layer-icon">${icon('shield',32)}</span><h3>ملفات الحالات الفردية</h3><p>الأسماء والعناوين والسجلات الحساسة تبقى حصرًا عند مقدّمي الخدمة المختصين المخوّلين.</p>${pill('خارج المرصد العام','pill-neutral')}</article></div></div></section><section class="section section-soft"><div class="container two-col-info"><div><span class="eyebrow">قياس الأثر</span><h2>لا نقيس عدد الأنشطة وحده؛ بل نسأل عما تغيّر.</h2><p>يستند إطار التقييم المقترح إلى معايير الملاءمة والاتساق والفعالية والكفاءة والأثر والاستدامة، مع التكييف المنهجي للسياق وحقوق الأطفال.</p><a class="text-link" href="https://www.oecd.org/en/publications/applying-evaluation-criteria-thoughtfully_543e84ed-en.html" target="_blank" rel="noopener noreferrer">المرجع المهني للتقييم ${icon('external',17)}</a></div><div class="criteria-grid">${['الملاءمة','الاتساق','الفعالية','الكفاءة','الأثر','الاستدامة'].map((t,i)=>`<div><span>${String(i+1).padStart(2,'0')}</span><strong>${t}</strong></div>`).join('')}</div></div></section><section class="section"><div class="container closing-box"><div><span class="eyebrow eyebrow-gold">مرصد في طور التصميم</span><h2>الأرقام الموثوقة تبدأ من منهجية سليمة.</h2><p>قبل نشر أي لوحة بيانات، يلزم قاموس مفاهيم، وتوثيق المصادر، واختبار جودة، وقواعد تمنع تعرّف الأفراد.</p></div><div>${btn('#/research','مجالات البحث','gold','arrow')}</div></div></section>`;}
function initiativeCard(o){return `<a href="#/initiative/${o.id}" class="initiative-card"><div class="initiative-card-top"><span>${icon(o.icon,26)}</span>${pill(o.phase,'pill-neutral')}</div><span class="initiative-type">${esc(o.category)} · ${esc(o.year)}</span><h3>${esc(o.title)}</h3><p>${esc(o.summary)}</p><div class="initiative-foot">ملف المبادرة ${icon('arrow',18)}</div></a>`;}
function initiatives(){const cats=['الكل','مرحلة الإطلاق','المرحلة الثانية','مرحلة التوسع'];let list=D.initiatives.filter(x=>initiativeFilter==='الكل'||x.phase===initiativeFilter);return pageHero('المبادرات والمشروعات','محفظةٌ واحدة،<br/><em>وأولويات تتقدم بتوازن.</em>','ثماني مبادرات مستقبلية تتكامل مع المكتبة والمجلة والبحوث، وتُفتح تدريجيًا بعد توفر التمويل والحوكمة والقدرات.',`${icon('layers',64)}<small>برامج قابلة للنمو</small>`)+`<section class="section"><div class="container"><div class="filter-bar"><div class="tabs">${cats.map(c=>`<button class="filter-pill ${initiativeFilter===c?'selected':''}" type="button" data-action="initiative-filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div id="initiative-list" class="initiative-grid">${list.map(initiativeCard).join('')||empty()}</div><p class="muted-note">المبادرات الواردة تصورات غير مفعلة حاليًا، وتواريخها أهداف تخطيطية مرتبطة بموارد وقرارات اعتماد.</p></div></section><section class="section section-soft"><div class="container">${secHead('ترتيب الأولويات','التدرج شرطٌ <span class="em-green">للنجاح والاستدامة.</span>')}<div class="timeline-list">${D.timeline.map((t,i)=>`<div class="timeline-entry"><span class="timeline-index">${String(i+1).padStart(2,'0')}</span><div><small>${esc(t.period)}</small><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></div></div>`).join('')}</div></div></section>`;}
function initiativeDetail(id){const o=D.initiatives.find(x=>x.id===id);if(!o)return notFound();return pageHero('تفاصيل مبادرة مقترحة',esc(o.title),o.summary,`${icon(o.icon,62)}<small>${esc(o.year)}</small>`)+`<section class="section"><div class="container detail-grid"><div class="detail-main"><div class="detail-status">${pill('مبادرة مقترحة','pill-warm')}${pill(o.phase,'pill-neutral')}</div><span class="eyebrow">المبرر والأثر</span><h2>ما القيمة التي يمكن أن تضيفها المبادرة؟</h2><p>${esc(o.summary)} وهي ترتبط بمنظومة المركز البحثية والمعرفية، وتُنفّذ فقط إذا توافرت جهة مسؤولة وميزانية ومراجعة أخلاقية ومؤشرات متابعة.</p><h3>مخرجات مستهدفة</h3><div class="outcome-grid">${o.deliverables.map(x=>`<div>${icon('check',20)} ${esc(x)}</div>`).join('')}</div><h3>الأثر المتوقع</h3><p>${esc(o.impact)} تُقاس النتائج لاحقًا بخط أساس وبيانات واقعية معتمدة، ولا تُعد هذه العبارة ادعاء نجاح مسبق.</p></div><aside class="detail-aside"><div class="detail-box"><span class="eyebrow">فرصة شراكة</span><h3>هل تتوافق المبادرة مع أولويات مؤسستك؟</h3><p>اطلب من الفريق المؤسس إعداد بطاقة مشروع تفصيلية وميزانية قابلة للمراجعة.</p><a class="btn btn-primary" href="#/contact?initiative=${o.id}">أبدي اهتمامي ${icon('arrow',17)}</a><a href="#/initiatives" class="text-link">جميع المبادرات ${icon('arrow',16)}</a></div></aside></div></section>`;}
function governance(){return pageHero('الحوكمة وخارطة الطريق','مؤسسةٌ تتجاوز الأشخاص،<br/><em>وتحفظ دور المؤسس.</em>','يُقترح مسار انتقالي لمحمد شندي الراوي يبدأ بالإدارة التنفيذية، ثم الإدارة العامة، وصولًا إلى رئاسة مجلس الإدارة بشروط الحوكمة والتقييم والقانون.',`${icon('scale',66)}<small>نظامٌ يحفظ الاستقلال</small>`)+`<section class="section"><div class="container">${secHead('المؤسس والقيادة','انتقالٌ مسؤول من <span class="em-green">التأسيس إلى الاستدامة.</span>','المراحل وظائف مقترحة لا تعيينات تلقائية أو حقوق مستحقة.') }<div class="governance-steps">${D.governance.map((g,i)=>`<article><span class="phase-number">0${i+1}</span><small>${esc(g.stage)}</small><h3>${esc(g.position)}</h3><p>${esc(g.desc)}</p></article>`).join('')}</div></div></section><section class="section section-soft"><div class="container">${secHead('العلاقة المؤسسية','شراكة مقترحة مع <span class="em-green">جمعية الشام.</span>','النموذج المرجّح في الدراسة: ذراع معرفية متخصصة ذات استقلال علمي ثم استقلال قانوني تدريجي عند النضج.') }<div class="institutional-model"><div class="institution-box"><span>${icon('users',35)}</span><h3>جمعية الشام لرعاية وكفالة الأيتام</h3><p>خبرة تنفيذية ورعاية ميدانية وشراكات محتملة، بحسب التفويض والاتفاق الرسمي.</p></div><div class="connection">${icon('arrow',30)}<span>مذكرة تفاهم وحوكمة</span>${icon('arrow',30)}</div><div class="institution-box institution-dark"><span>${icon('book-open',35)}</span><h3>مركز دراسات وأبحاث الأيتام</h3><p>بحث ومعرفة وتقييم وأرشيف واستشارات، باستقلال منهجي وتحريري وحماية للبيانات.</p></div></div><div class="notice-inline">${icon('alert',22)} عرض العلاقة لا يعني أنها معتمدة أو منشأة قانونيًا؛ يلزم قرار من الجهات المختصة ومذكرة تحدد الحقوق والأدوار والموارد.</div></div></section><section class="section"><div class="container">${secHead('من القرار إلى التنفيذ','خارطة طريق <span class="em-green">لخمس سنوات.</span>') }<div class="timeline-list">${D.timeline.map((t,i)=>`<div class="timeline-entry"><span class="timeline-index">${String(i+1).padStart(2,'0')}</span><div><small>${esc(t.period)}</small><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></div></div>`).join('')}</div></div></section>`;}
function partnerships(){let total=D.budget.reduce((s,o)=>s+o.amount,0);return pageHero('المانحون والشركاء','استثمارٌ في معرفةٍ<br/><em>يتسع أثرها عبر الزمن.</em>','دعوة للجهات المانحة والجامعات والمؤسسات والجمعيات لبناء منصة مستقلة للبحث والتقييم والمكتبة والمجلة، بعد استكمال الاعتمادات اللازمة.',`${icon('users',68)}<small>شراكات تقوم على الوضوح</small>`)+`<section class="section"><div class="container">${secHead('أين يمكن أن يكون الأثر؟','ثلاث بوابات <span class="em-green">للدعم المعرفي.</span>','كل باب يتحول إلى مقترح مشروع وميزانية ومؤشرات ونظام تقارير بعد التشاور.') }<div class="partner-tracks"><article><span>${icon('book-open',30)}</span><h3>ادعم أصلًا معرفيًا دائمًا</h3><p>تأسيس المكتبة والتزويد والفهرسة والرقمنة المرخصة والحفظ طويل الأمد.</p><a href="#/contact?interest=library">إبداء الاهتمام ${icon('arrow',17)}</a></article><article><span>${icon('microscope',30)}</span><h3>ادعم بحثًا يغيّر القرار</h3><p>تمويل دراسات ذات منهجية واضحة وتقييمات أثر وموجزات سياسات قابلة للاستخدام.</p><a href="#/contact?interest=research">إبداء الاهتمام ${icon('arrow',17)}</a></article><article><span>${icon('graduation',30)}</span><h3>ادعم بناء القدرات والنشر</h3><p>مجلة شهرية معرفية وزمالات باحثين وتدريب للمؤسسات وحلقات نقاش.</p><a href="#/contact?interest=publication">إبداء الاهتمام ${icon('arrow',17)}</a></article></div></div></section><section class="section section-soft"><div class="container"><div class="budget-heading"><div><span class="eyebrow">سيناريو تخطيطي</span><h2>تقدير مالي أولي <span class="em-green">قابل للمراجعة.</span></h2><p>في الدراسة تفكيك لسيناريو افتراضي لسنة تشغيل واحدة، وليس طلب تمويل معتمدًا أو عرض أسعار نهائيًا.</p></div><div class="budget-total"><small>السيناريو المعياري الافتراضي</small><strong dir="ltr">$${money(total)}</strong><span>دولار أمريكي / سنة افتراضية</span></div></div><div class="budget-items">${D.budget.map(o=>`<div class="budget-item"><div><span>${esc(o.title)}</span><strong dir="ltr">$${money(o.amount)}</strong></div><div class="bar-track"><span style="width:${(100*o.amount/total).toFixed(1)}%"></span></div></div>`).join('')}</div><p class="muted-note">تشمل الأرقام احتياطي المخاطر، وتختلف التكاليف الفعلية باختلاف بلد الترخيص والتوظيف والاستضافة وتكاليف التعاقد.</p></div></section><section class="section"><div class="container">${secHead('الممارسة المسؤولة','ما الذي تتوقعه <span class="em-green">الجهة المانحة؟</span>') }<div class="features-grid value-grid">${[{icon:'file',title:'مخرجات قابلة للمراجعة',text:'بطاقات مشاريع، وخط أساس، وتقارير مرحلية ومالية عند التعاقد.'},{icon:'shield',title:'حوكمة وحماية',text:'بنود واضحة لحماية الأطفال والبيانات وتضارب المصالح والتدقيق.'},{icon:'scale',title:'استقلال علمي',text:'لا يتحكم الممول في النتائج البحثية أو يطلب تغييرها.'},{icon:'target',title:'أثر يمكن تعلمه',text:'تقييم وتحسين، وإعلان للحدود والإخفاقات بقدر ما يسمح القانون والخصوصية.'}].map(feature).join('')}</div></div></section><section class="section"><div class="container closing-box"><div><span class="eyebrow eyebrow-gold">ملف الشراكة</span><h2>ابدأ بمراجعة الدراسة، ثم حدّد نوع الاهتمام.</h2><p>الوثيقة تتضمن مبادرات وخارطة أعمال وسيناريو تمويل أولي وسياسات مقترحة.</p></div><div>${btn(pdf,'تحميل الدراسة PDF','gold','download')}${btn('#/contact','طلب مناقشة شراكة','outline-light','arrow')}</div></div></section>`;}
function privacy(){return pageHero('الخصوصية وسلامة البيانات','الثقة تبدأ <em>بالحد الأدنى من المعلومات.</em>','تعهد تصميمي للموقع التجريبي؛ يتطلب الإطلاق العام اعتماد سياسة خصوصية قانونية تراعي بلد الاستضافة والتسجيل.',`${icon('shield',67)}<small>الحماية من التصميم</small>`)+`<section class="section"><div class="container policy-text"><h2>خصوصية الزوار وبيانات التواصل</h2><p>يستخدم هذا النموذج واجهة تصفح لا تتطلب حسابًا أو ملفات تعريف للزوار. نموذج الاهتمام يجمع بيانات الاتصال المهنية التي يقدمها الشخص طوعًا فقط، ولا ينبغي أن يتضمن أسماء أطفال أو ملفات حالات أو بيانات صحية. في التشغيل الخادمي، تحفظ الرسائل في ملف على الخادم إلى حين تهيئة تخزين إنتاجي آمن؛ أما في النسخة الثابتة فلا يتم إرسالها لأي جهة.</p><h2>بيانات الأطفال والأسر</h2><p>لا يخصص هذا الموقع نموذجًا لإدخال بيانات أطفال أو تسجيل حالات، ولا ينشر صورًا شخصية أو قصصًا تعريفية لقاصرين. تبقى الملفات الحساسة لدى الجهات المرخصة والمخولة، ويحتاج أي مشروع بحث يتناول بيانات شخصية إلى تقييم مخاطر، ومراجعة أخلاقية، وحقوق وصول، وموافقات متناسبة.</p><h2>الكوكيز والتحليلات</h2><p>لا تستخدم النسخة الحالية تقنيات تتبع أو إعلانات طرف ثالث. قد يجري تحميل خط عرض اختياري من Google Fonts إذا كان الجهاز متصلًا بالإنترنت. لا تُفعّل إحصاءات الاستخدام أو خدمات البريد الخارجية دون إعداد إشعار مناسب وسياسة احتفاظ معتمدة.</p><h2>الحقوق والمحتوى</h2><p>المواد المنشورة في الفهرس إما ملفات مقدمة من المشروع أو روابط لمصادر خارجية ذات حقوق تخص ناشريها. لا تمنح الروابط حق إعادة نشر محتواها. الشعار والعناصر التخطيطية المعروضة جزء من المقترح البصري للمركز وتخضع لاعتماد الجهة المالكة.</p><h2>حدود النسخة الحالية</h2><p>هذه نسخة عرض مؤسسية. قبل النشر الرسمي يلزم تحديد الجهة القانونية المسؤولة، ومعلومات الاتصال، وفترات الاحتفاظ، وآلية طلب الوصول أو المحو، والنسخ الاحتياطي، وأذونات الاستضافة والتحديث الأمني.</p></div></section>`;}

n'].includes(selected)?'selected':''}>${selected && !['partnership','funding','research','library','publication'].includes(selected)?'مبادرة: '+esc(D.initiatives.find(x=>x.id===selected)?.title||selected):'استفسار آخر'}</option></select></label></div><label>رسالتك <span>*</span><textarea name="message" rows="6" required minlength="12" maxlength="3000" placeholder="اكتب باختصار فكرة التعاون أو السؤال... (من دون معلومات عن أطفال أو حالات فردية)"></textarea></label><label class="honeypot" aria-hidden="true">Website<input type="text" name="website" tabindex="-1" autocomplete="off" /></label><label class="consent"><input type="checkbox" name="consent" required/><span>أوافق على استخدام بيانات التواصل المهنية للرد على طلبي، وأؤكد أن الرسالة لا تحتوي على معلومات شخصية للأطفال.</span></label><div class="form-bottom"><button class="btn btn-primary" id="send-request" type="submit">إرسال / حفظ طلب الاهتمام ${icon('arrow',18)}</button><small>لا يستقبل هذا النموذج طلبات كفالة مباشرة أو بلاغات حماية عاجلة.</small></div><div id="form-feedback" class="form-feedback" aria-live="polite"></div></form></div><aside class="contact-aside"><div class="aside-block aside-gold"><span>${icon('file',26)}</span><h3>ابدأ بملف المشروع</h3><p>نسخة تحليلية متكاملة من الدراسة التأسيسية متاحة للقراءة والمراجعة.</p><a ${visit(pdf)} download>تحميل PDF ${icon('download',17)}</a><a ${visit(docx)} download>تحميل Word ${icon('download',17)}</a></div><div class="aside-block"><h3>الخصوصية أولًا</h3><p>لا ترسل أسماء أطفال أو صورهم أو تفاصيل طبية أو وثائق شخصية. للحالات الطارئة توجّه إلى جهة حماية الطفل المحلية المختصة.</p><a href="#/privacy">الاطلاع على سياسة الخصوصية ${icon('arrow',16)}</a></div><div class="aside-block"><h3>قنوات التواصل الرسمية</h3><p>سيُضاف البريد والعنوان الرسميان بعد اعتماد المؤسسة؛ لا يُعرض هنا عنوان أو حساب غير موثّق.</p></div></aside></div></section>`;}
