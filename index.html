 const selected=all.filter(x=>(adminStatus==='all'||x.status===adminStatus)&&(!q||(x.name+' '+x.organization+' '+x.email+' '+x.interest+' '+x.message).toLowerCase().includes(q)));
 const options=[['new','جديد'],['in_progress','قيد المتابعة'],['closed','مغلق']];
 panel.innerHTML=`<div class="admin-counters"><div><strong>${all.length}</strong><span>إجمالي الطلبات</span></div><div><strong>${counts.new}</strong><span>جديد</span></div><div><strong>${counts.in_progress}</strong><span>قيد المتابعة</span></div><div><strong>${counts.closed}</strong><span>مغلق</span></div></div><div class="admin-filter-bar"><label>ابحث في الطلبات<input type="search" id="admin-search" value="${attr(adminSearch)}" placeholder="الاسم أو البريد أو مجال الاهتمام..." /></label><label>حالة الطلب<select id="admin-status-filter"><option value="all" ${adminStatus==='all'?'selected':''}>كل الحالات</option>${options.map(([key,label])=>`<option value="${key}" ${adminStatus===key?'selected':''}>${label}</option>`).join('')}</select></label><button class="btn btn-outline" type="button" data-action="export-csv">تصدير CSV ${icon('download',16)}</button></div><p class="admin-result-count">عرض ${selected.length} من ${all.length} طلبات. لا تضع بيانات أطفال في الملاحظات الإدارية.</p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>التاريخ والمرجع</th><th>التواصل</th><th>الموضوع والرسالة</th><th>المتابعة</th></tr></thead><tbody>${selected.map(x=>`<tr><td><strong>${esc(x.createdAt?.slice(0,10))}</strong><small dir="ltr">${esc(x.id)}</small></td><td><strong>${esc(x.name)}</strong><small>${esc(x.organization||'بدون جهة')}</small><a href="mailto:${attr(x.email)}" dir="ltr">${esc(x.email)}</a></td><td><b>${esc(x.interest)}</b><p class="admin-message">${esc(x.message)}</p></td><td><div class="admin-tools"><select data-action="inquiry-status" data-id="${attr(x.id)}" aria-label="حالة طلب ${attr(x.id)}">${options.map(([key,label])=>`<option value="${key}" ${x.status===key?'selected':''}>${label}</option>`).join('')}</select><label>ملاحظة داخلية<textarea data-inquiry-note="${attr(x.id)}" maxlength="1200" rows="3" placeholder="ملاحظة متابعة داخلية">${esc(x.note||'')}</textarea></label><button type="button" class="admin-save" data-action="save-inquiry-note" data-id="${attr(x.id)}">حفظ الملاحظة</button><button type="button" class="admin-remove" data-action="delete-inquiry" data-id="${attr(x.id)}">حذف نهائي</button></div></td></tr>`).join('')||'<tr><td colspan="4">لا توجد طلبات مطابقة.</td></tr>'}</tbody></table></div>`;
}
function drawEditorial(){
 const all=window._editableContent||[],panel=$('#admin-panel');if(!panel)return;
 panel.innerHTML=`<div class="editor-header"><div><span class="eyebrow">إدارة المعرفة</span><h3>المقالات ومراجع المكتبة</h3><p>مسودات داخلية، أو مواد منشورة تظهر للجمهور. لا تضف أي معلومات شخصية عن أطفال أو وثائق لم تُتح حقوقها.</p></div><button type="button" class="btn btn-primary" data-action="new-content">مادة جديدة ${icon('arrow',16)}</button></div><div class="editor-table-wrap"><table class="admin-table"><thead><tr><th>العنوان</th><th>النوع</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${all.map(o=>`<tr><td><strong>${esc(o.title)}</strong><small>${esc(o.updatedAt?.slice(0,10))}</small></td><td>${esc(contentKinds[o.kind]||o.kind)}</td><td>${pill(o.status==='published'?'منشور':'مسودة',o.status==='published'?'pill-green':'pill-neutral')}</td><td><div class="admin-tools"><button type="button" class="admin-save" data-action="edit-content" data-id="${attr(o.id)}">تحرير</button><button type="button" class="admin-remove" data-action="delete-content" data-id="${attr(o.id)}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="4">لم تُضف مواد جديدة بعد. محتوى الدراسة التأسيسية ونماذجها يبقى متاحًا.</td></tr>'}</tbody></table></div><div id="editor-form-slot"></div>`;
 if(adminEditing){const o=all.find(x=>x.id===adminEditing);if(o)drawEditorForm(o);else adminEditing=null;}
}
function drawEditorForm(o=null){
 const el=$('#editor-form-slot');if(!el)return;
 el.innerHTML=`<form id="editor-form" class="editor-form"><div class="editor-form-title"><h3>${o?'تحرير مادة':'إضافة مادة معرفية'}</h3><button type="button" data-action="cancel-content" class="admin-cancel">إغلاق</button></div><div class="editor-grid"><label>نوع المادة<select name="kind" id="content-kind"><option value="article">مقالة للمجلة</option><option value="resource">مصدر للمكتبة</option></select></label><label>حالة المادة<select name="status"><option value="draft">مسودة - خاصة بالإدارة</option><option value="published">منشورة - تظهر للزوار</option></select></label><label>العنوان<input name="title" required minlength="6" maxlength="180" placeholder="عنوان واضح ومحدد"/></label><label>التصنيف<input name="category" required minlength="2" maxlength="85" placeholder="بحث / حماية / فهرس..."/></label><label>المؤلف أو الجهة<input name="author" maxlength="130" placeholder="المؤلف أو الجهة المرجعية"/></label></div><label>ملخص المادة<textarea name="summary" required minlength="20" maxlength="550" rows="3" placeholder="20 إلى 550 حرفًا"></textarea></label><div id="editor-article-fields"><label>نص المقالة<textarea name="body" required minlength="100" maxlength="14000" rows="11" placeholder="اكتب المقالة هنا. افصل الفقرات بسطر فارغ"></textarea></label></div><div id="editor-resource-fields" hidden><label>رابط المصدر الأصلي (HTTPS)<input name="url" type="url" maxlength="850" placeholder="https://..."/></label></div><p class="muted-note">راجع الدقة العلمية وحقوق النشر وحماية الأطفال قبل تغيير الحالة إلى «منشورة».</p><div class="editor-submit"><button type="submit" class="btn btn-primary">حفظ المادة ${icon('check',17)}</button><span id="editor-feedback" role="status" aria-live="polite"></span></div></form>`;
 const form=$('#editor-form');if(o){for(const field of ['kind','status','title','category','author','summary','body','url'])if(form.elements.namedItem(field))form.elements.namedItem(field).value=o[field]||'';}
 toggleEditorKind();
 el.scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleEditorKind(){
 const f=$('#editor-form');if(!f)return;const resource=f.elements.namedItem('kind').value==='resource';
 $('#editor-article-fields').hidden=resource;$('#editor-resource-fields').hidden=!resource;
 f.elements.namedItem('body').required=!resource;f.elements.namedItem('url').required=resource;
}
async function adminMutation(id,method,payload){
 const token=getSessionToken();if(!token)return toast('يرجى تسجيل الدخول مجددًا.','error');
 const url='./api/admin/inquiries/'+encodeURIComponent(id);
 try{
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+token,...(payload?{'Content-Type':'application/json'}:{})},...(payload?{body:JSON.stringify(payload)}:{})});
  const response=await r.json();if(!r.ok)throw new Error(response.error||'تعذر تعديل الطلب.');
  toast(response.message);await loadAdmin();
 }catch(e){toast(e.message||'تعذر حفظ التعديل.','error');await loadAdmin();}
}
async function saveContent(form){
 const token=getSessionToken(),data=new FormData(form);
 const item={};for(const key of ['kind','status','title','category','author','summary','body','url'])item[key]=String(data.get(key)||'').trim();
 const editingId=adminEditing,feedback=$('#editor-feedback');feedback.textContent='جارٍ الحفظ...';
 try{
  const url=editingId?'./api/admin/content/'+encodeURIComponent(editingId):'./api/admin/content';
  const r=await fetch(url,{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(item)});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر حفظ المادة.');
  adminEditing=null;toast(d.message);await loadAdmin();await loadPublicContent();
 }catch(e){feedback.textContent=e.message||'تعذر الاتصال بالخادم.';}
}
async function removeContent(id){
 const token=getSessionToken();if(!token)return;
 try{
  const r=await fetch('./api/admin/content/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر حذف المادة.');
  adminEditing=null;toast(d.message);await loadAdmin();await loadPublicContent();
 }catch(e){toast(e.message,'error');}
}
async function adminLogout(){
 const token=getSessionToken();clearSessionToken();
 if(token)fetch('./api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
 render();toast('تم تسجيل الخروج');
}
function exportCsv(){let x=window._currentInquiries||[],rows=[['id','date','name','email','organization','interest','message','status'],...x.map(o=>[o.id,o.createdAt,o.name,o.email,o.organization,o.interest,o.message,o.status])] ;let csv='\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='طلبات-اهتمام-مركز-الابحاث.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
document.addEventListener('click',e=>{
 if(e.target.closest('#skip-to-content')){e.preventDefault();$('#main-content').focus();return;}
 const toggle=e.target.closest('#mobile-toggle');if(toggle){toggleMenu();return;}
 const navLink=e.target.closest('#mobile-nav a');if(navLink){mobileOpen=false;renderHeader();}
 const action=e.target.closest('[data-action]');if(!action)return;
 const x=action.dataset.action;
 if(x==='domain-filter'){filterDomain=action.dataset.value;rerenderResearch();}
 else if(x==='catalog-filter'){filterCatalog=action.dataset.value;rerenderCatalog();}
 else if(x==='initiative-filter'){initiativeFilter=action.dataset.value;rerenderInitiatives();}
 else if(x==='close-menu'){mobileOpen=false;renderHeader();}
 else if(x==='share'){sharePage();}
 else if(x==='logout'){adminLogout();}
 else if(x==='admin-tab'){adminTab=action.dataset.value;adminEditing=null;drawAdmin();}
 else if(x==='delete-inquiry'){if(window.confirm('هل تريد حذف طلب الاهتمام نهائيًا؟ لا يمكن التراجع عن ذلك.'))adminMutation(action.dataset.id,'DELETE');}
 else if(x==='save-inquiry-note'){const note=document.querySelector('[data-inquiry-note="'+action.dataset.id+'"]')?.value||'';adminMutation(action.dataset.id,'PATCH',{note});}
 else if(x==='export-csv')exportCsv();
 else if(x==='new-content'){adminEditing=null;drawEditorForm();}
 else if(x==='cancel-content'){adminEditing=null;$('#editor-form-slot').innerHTML='';}
 else if(x==='edit-content'){adminEditing=action.dataset.id;drawEditorForm((window._editableContent||[]).find(o=>o.id===adminEditing));}
 else if(x==='delete-content'){if(window.confirm('حذف هذه المادة نهائيًا؟'))removeContent(action.dataset.id);}
});
document.addEventListener('change',e=>{
 const s=e.target;
 if(s.dataset.action==='inquiry-status')adminMutation(s.dataset.id,'PATCH',{status:s.value});
 else if(s.id==='admin-status-filter'){adminStatus=s.value;drawInquiries();}
 else if(s.id==='content-kind')toggleEditorKind();
});
document.addEventListener('input',e=>{
 if(e.target.id==='research-search'){researchQuery=e.target.value;rerenderResearch();}
 else if(e.target.id==='catalog-search'){catalogQuery=e.target.value;rerenderCatalog();}
 else if(e.target.id==='admin-search'){
  adminSearch=e.target.value;const begin=e.target.selectionStart||adminSearch.length;
  drawInquiries();const input=$('#admin-search');if(input){input.focus();input.setSelectionRange(begin,begin);}
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id==='interest-form'){e.preventDefault();handleContact(e.target);}
 else if(e.target.id==='admin-login'){e.preventDefault();handleAdminLogin(e.target);}
 else if(e.target.id==='editor-form'){e.preventDefault();saveContent(e.target);}
});
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&mobileOpen){mobileOpen=false;renderHeader();}});
render();if(routeNow==='/admin')loadAdmin();loadPublicContent();
})();
</script>
</body>
</html>
